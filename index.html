<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video Team · DR Dashboard</title>
<style>
  /* "Glass on warm gradient" look (after the Admin Dashboard V5 reference), in black + orange. */
  :root{
    --or:#FF6B1A; --or2:#FF9A5C; --or3:#E8480C;
    --bg:#120602;
    --white:#FFF8F3; --wmuted:rgba(255,240,230,.72); --wdim:rgba(255,236,224,.5);
    /* page-level text (on the gradient) */
    --fg:var(--white); --muted:var(--wmuted); --dim:var(--wdim);
    --line:rgba(255,255,255,.14); --grey:rgba(255,255,255,.18);
    --panel:rgba(255,246,240,.86); --panel2:rgba(255,255,255,.55); --panel3:rgba(255,255,255,.75);
    --ink:#2A1208; --ink2:#6B4636; --ink3:#9C7564;
    --up:#1E9E55; --down:#D9361E; --bad:#E5391F;
    --r:28px; --r2:18px;
    --ease:cubic-bezier(.25,.1,.25,1);
    --pad:clamp(14px,2.6vw,36px);
    --hatch:repeating-linear-gradient(135deg,rgba(80,35,15,.10) 0 2px,transparent 2px 7px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  html,body{min-height:100%;color:var(--fg);font-family:"Inter","SF Pro Display",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden;background:var(--bg)}
  /* gradient on a fixed layer so it stays behind the cards everywhere (iOS ignores background-attachment:fixed) */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
      radial-gradient(1100px 620px at 50% 26%,rgba(255,122,46,.95) 0%,rgba(214,78,18,.85) 34%,rgba(110,32,8,.0) 72%),
      radial-gradient(900px 500px at 100% 100%,rgba(255,107,26,.55),transparent 70%),
      linear-gradient(180deg,#1A0803 0%,#4A1606 38%,#8E300C 70%,#3A1205 100%)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:12px}

  /* ---- layout: floating top bar instead of sidebar ---- */
  .app{display:block;min-height:100vh;padding:14px var(--pad) 0}
  .side{position:sticky;top:12px;z-index:5;max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;
    padding:10px 12px;border-radius:999px;background:rgba(36,10,3,.72);border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 10px 40px rgba(20,5,0,.35)}
  .brand{display:flex;align-items:center;gap:10px;flex:none;padding-right:6px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--or2),var(--or3));display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;box-shadow:0 4px 14px rgba(232,72,12,.5)}
  .brand b{display:block;font-size:15px;font-weight:600;color:#fff;white-space:nowrap}.brand span{display:none}
  .side>div:nth-child(2){flex:1;min-width:0;display:flex;justify-content:center}
  .nav-h,.side-foot{display:none}
  .months{display:flex;flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);max-width:100%}
  .months::-webkit-scrollbar{display:none}
  .mbtn{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 14px;border-radius:999px;color:var(--wmuted);font-size:13px;transition:background .18s var(--ease),color .18s var(--ease)}
  .mbtn:hover{color:#fff;background:rgba(255,255,255,.10)}
  .mbtn.on{background:linear-gradient(180deg,#FF8A47,#F2581A);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(232,72,12,.45),inset 0 1px 0 rgba(255,255,255,.35)}
  .mbtn .c{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
  .mbtn.all{margin:0}
  .mbtn.all.on{background:#fff;color:var(--ink);box-shadow:none}

  main{padding:34px 0 56px;max-width:1400px;width:100%;margin:0 auto;min-width:0}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  header>div:first-child{min-width:0}
  .eyebrow{font-size:13px;font-weight:500;color:var(--wmuted);margin-bottom:6px}
  h1{font-size:clamp(38px,5vw,64px);font-weight:500;letter-spacing:-.035em;line-height:1.02;color:#fff}
  h1 .b{color:var(--wmuted);font-weight:400}
  .sub{color:var(--wmuted);font-size:15px;margin-top:10px;line-height:1.4}
  .stamp{font-size:12px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:9px 14px;border-radius:999px;white-space:nowrap;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .stamp i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7CF5A6;margin-right:8px;vertical-align:1px;box-shadow:0 0 8px #7CF5A6}

  /* brand filter: dark chips like the reference's sub-tabs */
  .filters{display:flex;align-items:center;gap:6px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .filters::-webkit-scrollbar{display:none}
  .filters .lab{font-size:13px;color:var(--wdim);margin-right:4px;flex:none}
  .pill{all:unset;cursor:pointer;flex:none;font-size:13px;min-height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;color:var(--wmuted);background:rgba(255,255,255,.12);transition:background .18s var(--ease),color .18s var(--ease)}
  .pill:hover{color:#fff;background:rgba(255,255,255,.2)}
  .pill.on{background:rgba(30,8,2,.72);color:#fff;font-weight:600}

  /* ---- cards: light frosted glass with dark ink ---- */
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{--fg:var(--ink);--muted:var(--ink2);--dim:var(--ink3);--line:rgba(80,35,15,.10);--grey:rgba(80,35,15,.12);
    color:var(--ink);background:var(--panel);border:1px solid rgba(255,255,255,.55);border-radius:var(--r);padding:clamp(18px,1.8vw,24px);min-width:0;
    -webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);box-shadow:0 18px 50px rgba(40,10,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
  .card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .card h3 small{font-size:12px;color:var(--ink3);font-weight:400}
  .kpi h3{font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:10px}
  .kpi .v{font-size:clamp(38px,3.6vw,54px);font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .n{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.4}
  /* hero = the dark card */
  .kpi.hero{--fg:#fff;--muted:var(--wmuted);--dim:var(--wdim);color:#fff;background:linear-gradient(160deg,rgba(70,20,6,.78),rgba(30,8,2,.82));border-color:rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(20,5,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
  .kpi.hero h3,.kpi.hero .n{color:var(--wmuted)}
  .kpi.hero .v{background:linear-gradient(180deg,#FFB27F,var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kpi.alert .v{color:var(--bad)}
  .kpi.alert h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:8px;align-self:center}
  .kpi.alert h3{justify-content:flex-start}
  .ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center}
  .sec{margin-top:16px}
  .row2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .row3{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* ---- monthly trend: capsule bar chart ---- */
  .strip{position:relative;display:flex;align-items:stretch;gap:clamp(8px,1.6vw,22px);overflow-x:auto;scrollbar-width:none;padding:6px 4px 2px}
  .strip::-webkit-scrollbar{display:none}
  .strip .avg{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed rgba(80,35,15,.35);pointer-events:none;z-index:0}
  .strip .avg b{position:absolute;right:4px;top:-12px;font-size:11px;font-weight:600;color:#fff;background:var(--ink);padding:3px 8px;border-radius:8px}
  .mc{all:unset;cursor:pointer;flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px;position:relative;z-index:1}
  .mc .plot{height:190px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .mc .cap{width:min(64px,100%);border-radius:999px;background:var(--hatch),rgba(255,255,255,.55);border:1px solid rgba(80,35,15,.08);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;transition:transform .2s var(--ease),background .2s var(--ease)}
  .mc:hover .cap{transform:translateY(-3px)}
  .mc.on .cap{background:linear-gradient(180deg,#FF9A5C 0%,#FF6B1A 55%,#E8480C 100%);border-color:transparent;box-shadow:0 12px 28px rgba(232,72,12,.45),inset 0 2px 0 rgba(255,255,255,.35)}
  .mc .mv{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .mc.on .mv{font-size:13px;color:#fff;background:var(--ink);padding:5px 9px;border-radius:10px}
  .mc .mn{font-size:13px;color:var(--ink2)}
  .mc.on .mn{color:var(--ink);font-weight:600}
  .mc .mf{font-size:11px;color:var(--ink3);white-space:nowrap}
  .mc .mf b{color:var(--or3);font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ---- brand cards ---- */
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
  .bc{all:unset;cursor:pointer;background:var(--panel2);border:1px solid rgba(255,255,255,.7);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:background .18s var(--ease),transform .18s var(--ease)}
  .bc:hover{background:var(--panel3);transform:translateY(-2px)}
  .bc.on{background:var(--ink);color:#fff;border-color:transparent}
  .bc.on .bn,.bc.on .bs{color:rgba(255,240,230,.75)}
  .bc .bn{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bc .bv{font-size:30px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .bc .bs{font-size:12px;color:var(--ink3)}
  .share{height:6px;border-radius:999px;background:rgba(80,35,15,.10);overflow:hidden}
  .share i{display:block;height:100%;background:linear-gradient(90deg,var(--or2),var(--or));border-radius:999px}

  /* ---- status gauge ---- */
  svg text{font-family:inherit}
  #donut{display:flex;flex-direction:column;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink2);margin-top:10px;justify-content:center}
  .legend span{background:var(--panel2);border:1px solid rgba(255,255,255,.7);padding:5px 10px;border-radius:999px;white-space:nowrap}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:0}

  /* ---- team bars ---- */
  .bars{display:flex;flex-direction:column;gap:14px}
  .bar-row{display:grid;grid-template-columns:minmax(80px,110px) minmax(0,1fr) 48px;align-items:center;gap:12px;font-size:14px}
  .bar-row .lbl{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .num{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
  .track{height:14px;display:flex;gap:3px;border-radius:999px}
  .seg{height:100%;border-radius:999px;min-width:0}
  .track .seg:first-child{background:linear-gradient(90deg,var(--or2),var(--or))!important;box-shadow:0 3px 10px rgba(232,72,12,.3)}
  .track .seg:last-child{background:var(--hatch),rgba(255,255,255,.6)!important}

  .tag{display:inline-block;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--ink2);white-space:nowrap}
  .tag.od{background:rgba(229,57,31,.13);color:#C42A12}
  .tag.ok{background:rgba(30,158,85,.13);color:#167A41}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
  .tile{background:var(--panel2);border:1px solid rgba(255,255,255,.7);border-radius:var(--r2);padding:14px 12px}
  .tile b{display:block;font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile span{font-size:12px;color:var(--ink2)}
  .empty{color:var(--ink3);font-size:14px;padding:18px 0}
  .ta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr);gap:10px}
  .ta .t{background:var(--panel2);border:1px solid rgba(255,255,255,.7);border-radius:var(--r2);padding:16px;min-width:0}
  .ta .t b{display:block;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
  .ta .t span{display:block;font-size:13px;color:var(--ink2);margin-top:6px}
  .ta .t small{display:block;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ta .ppl{display:flex;flex-direction:column;gap:8px;font-size:13px}
  .ta .ppl div{display:flex;justify-content:space-between;gap:10px}
  .ta .ppl em{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ---- tables ---- */
  #att,#cl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:500;color:var(--ink3);font-size:12px;padding:0 10px 10px;white-space:nowrap}
  td{padding:13px 10px;border-top:1px solid rgba(80,35,15,.09);vertical-align:middle}
  td:not(.dr){white-space:nowrap}
  td.dr{min-width:200px;max-width:380px}
  tr:hover td{background:rgba(255,255,255,.45)}
  a.drl{color:var(--ink);text-decoration:none;font-weight:500}
  a.drl:hover{color:var(--or3)}
  a.drl .ext{font-size:11px;color:var(--ink3);margin-left:6px}
  td.r,th.r{text-align:right}
  .more{all:unset;cursor:pointer;color:var(--or3);font-size:14px;font-weight:600;margin-top:14px;display:inline-block}
  .more:hover{text-decoration:underline}
  .health{margin-top:16px;font-size:13px;color:var(--wmuted);line-height:1.7;padding:0 6px}
  .health b{color:#fff;font-weight:500}
  #tip{position:fixed;pointer-events:none;background:rgba(30,8,2,.92);color:#fff;border:1px solid rgba(255,255,255,.15);padding:8px 10px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .12s;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.4)}

  /* ---- sizes ---- */
  @media (max-width:1280px){.ta{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
  @media (max-width:1024px){.row2,.row3{grid-template-columns:1fr}}
  @media (max-width:820px){td.hide-m,th.hide-m{display:none}}
  @media (max-width:760px){
    .side{flex-wrap:wrap;border-radius:24px;gap:8px;top:8px}
    .side>div:nth-child(2){order:3;flex-basis:100%;justify-content:flex-start}
    .brand b{font-size:14px}
    main{padding-top:24px}
    .sub{font-size:14px}
    .ta{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid{gap:10px}.sec{margin-top:10px}
    .card{border-radius:22px}
    .mc{flex:0 0 58px;min-width:58px}.mc .plot{height:150px}
    td.dr{min-width:0}
    .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">VT</div><div><b>Video Team</b><span>DR Dashboard</span></div></div>
    <div><div class="nav-h">Month</div><nav class="months" id="months" aria-label="Choose month"></nav></div>
    <div class="side-foot">Data: <a href="https://docs.google.com/spreadsheets/d/1fCvUYFMAmWOy67kbWopl5OpHV2ZxY96okwEpro148EM/edit" target="_blank" rel="noopener">DR Sheet 2026</a><br>Updates every morning by 11 AM</div>
  </aside>

  <main>
    <header>
      <div>
        <p class="eyebrow">Video Team · DR Dashboard</p>
        <h1 id="mname">—</h1>
        <p class="sub" id="headline">—</p>
      </div>
      <div class="stamp"><i></i><span id="stamp">—</span></div>
    </header>

    <div class="filters" id="brandf" role="group" aria-label="Filter by brand"></div>

    <section class="grid kpis">
      <div class="card kpi"><h3><span id="k-total-h">Total DRs</span></h3><div class="v" id="k-total">—</div><div class="n" id="k-total-n">—</div></div>
      <div class="card kpi hero"><h3>Done</h3><div class="v" id="k-done">—</div><div class="n" id="k-done-n">—</div></div>
      <div class="card kpi"><h3>Pending</h3><div class="v" id="k-open">—</div><div class="n" id="k-open-n">—</div></div>
      <div class="card kpi alert"><h3>Late</h3><div class="v" id="k-od">—</div><div class="n" id="k-od-n">—</div></div>
    </section>

    <section class="card sec">
      <h3>Monthly trend <small id="strip-n">—</small></h3>
      <div class="strip" id="strip"></div>
    </section>

    <section class="card sec">
      <h3>Turnaround <small id="ta-n">From Basecamp</small></h3>
      <div id="ta"></div>
    </section>

    <section class="grid row2 sec">
      <div class="card">
        <h3>Brands <small id="brand-n">—</small></h3>
        <div class="bgrid" id="brands"></div>
      </div>
      <div class="card">
        <h3>Status</h3>
        <div id="donut"></div>
      </div>
    </section>

    <section class="grid row3 sec">
      <div class="card"><h3>Team <small>done / total</small></h3><div class="bars" id="team"></div></div>
      <div class="card"><h3>DR types</h3><div id="type"></div></div>
    </section>

    <section class="sec">
      <div class="card">
        <h3>Pending DRs <small id="att-n">—</small></h3>
        <div id="att"></div>
      </div>
    </section>
    <section class="sec">
      <div class="card">
        <h3>Closed DRs <small id="cl-n">—</small></h3>
        <div id="cl"></div>
      </div>
      <p class="health" id="health"></p>
    </section>
  </main>
</div>
<div id="tip"></div>

<script src="data.js"></script>
<script>
(function(){
  /* People who have left the team. From the given month on, their name is
     removed from DRs (a DR left with no owner shows as "Unassigned").
     Earlier months keep their name. month: 0 = Jan ... 10 = Nov */
  const TEAM_EXITS = [ {name:"Jatin", year:2026, month:10} ];

  /* Basecamp: a DR counts as Done if the sheet OR Basecamp says so. Close date and
     open date come from Basecamp (to-do created / ticked off). */
  const BC_URL = "/api/basecamp/closed";
  let BC = null;          // {todoId: {created, closed}} once loaded

  const D = window.DR_DATA;
  const MN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  const MS = MN.map(m=>m.slice(0,3));
  const $ = id => document.getElementById(id);
  const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
  const cap=s=>s[0].toUpperCase()+s.slice(1);

  const pdate = v => v ? new Date(v+"T00:00:00Z") : null;
  function normStatus(s){
    const t=(s||"").trim().toLowerCase();
    if(t==="done"||t==="approved") return "Done";
    if(t==="in progress") return "In progress";
    if(t==="pending review") return "In review";
    if(t==="waiting") return "Waiting";
    if(t==="na"||t==="scrapped") return "Dropped";
    if(t==="not started") return "Not started";
    return t ? s.trim() : "Not started";
  }
  function normType(s){
    const t=(s||"").trim().toLowerCase();
    if(!t) return null;
    if(t==="ai") return "AI";
    if(t.startsWith("special")) return "Special";
    if(t==="3d") return "3D";
    return cap(t);
  }
  function normBrand(s){
    const t=(s||"").trim(); if(!t) return "No brand";
    const u=t.toUpperCase();
    const MAP={POP:"SUGAR POP",SUGAR:"SUGAR",BWA:"BWA",QUENCH:"QUENCH",MOLTEN:"Molten",HR:"HR",SUGARQUOTED:"SUGAR Quoted"};
    return MAP[u.replace(/\s+/g,"")] || t;
  }
  const exitedBy=(name,y,m)=>TEAM_EXITS.some(x=>x.name.toLowerCase()===name.toLowerCase() && (y*12+m)>=(x.year*12+x.month));

  /* ---------- month tabs (already structured by build_data.py) ---------- */
  const tabs=[];
  D.tabs.forEach(tab=>{
    const tm=tab.month, year=tab.year;
    const items=tab.rows.map(r=>{
      let owners=(r.assigned||"").split(/,|&|\//).map(x=>x.trim()).filter(Boolean);
      const before=owners.length;
      owners=owners.filter(o=>!exitedBy(o,year,tm));
      return {
        name:r.name, link:r.link, sheetRaised:pdate(r.raised), sheetDue:pdate(r.due), todo:(r.link||"").match(/\/todos\/(\d+)/)?.[1]||null, sheetStatus:normStatus(r.status), raised:pdate(r.raised), due:pdate(r.due),
        brand:normBrand(r.brand), owners: owners.length?owners:["Not assigned"], orphaned: before>0&&owners.length===0,
        type: tab.hasType ? normType(r.type) : null, status:normStatus(r.status), tab:tabs.length
      };
    });
    tabs.push({name:tab.tab, m:tm, y:year, hasType:tab.hasType, items});
  });

  /* All months = every DR once: a DR carried into later tabs counts once, at its latest status.
     Matched by its Basecamp to-do (so a renamed DR is still one DR); rows without a link match by name + brand.
     (Two rows inside one tab are kept as two unless they point to the same to-do.) */
  function uniqueAll(){
    const latest=new Map();
    tabs.forEach((t,ti)=>{
      const seen=new Map();
      t.items.forEach(i=>{const k=i.todo ? "bc:"+i.todo : i.name.toLowerCase().replace(/\s+/g," ")+"|"+i.brand; if(!seen.has(k)) seen.set(k,[]); seen.get(k).push(i);});
      seen.forEach((arr,k)=>latest.set(k,arr));
    });
    return [].concat(...latest.values());
  }
  const ALL = uniqueAll();
  const BRANDS = (()=>{const c=new Map(); ALL.forEach(i=>c.set(i.brand,(c.get(i.brand)||0)+1)); return [...c.entries()].sort((a,b)=>(a[0]==="No brand")-(b[0]==="No brand")||b[1]-a[1]).map(e=>e[0]);})();

  /* ---------- helpers ---------- */
  const ist=new Date(Date.now()+330*60000);
  const today=Date.UTC(ist.getUTCFullYear(),ist.getUTCMonth(),ist.getUTCDate());
  const isDone=i=>i.status==="Done", isScr=i=>i.status==="Dropped", isOpen=i=>!isDone(i)&&!isScr(i);
  const odDays=i=> (isOpen(i)&&i.due) ? Math.round((today-i.due)/864e5) : 0;
  const isOD=i=>odDays(i)>0;
  const istDay=iso=>{const d=new Date(new Date(iso).getTime()+330*60000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());};
  const openedOn=i=> i.raised ? +i.raised : null;
  const daysOpen=i=>{const o=openedOn(i); if(o==null) return null; const end=i.bcClosed?istDay(i.bcClosed):today; return Math.max(0,Math.round((end-o)/864e5));};
  const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
  function applyBC(){
    tabs.forEach(t=>t.items.forEach(i=>{
      const b = BC && i.todo ? BC[i.todo] : null;
      i.bcCreated = b ? b.created : null; i.bcClosed = b ? b.closed : null; i.bcKnown = !!b;
      i.closedBy = b ? b.closedBy : null;
      i.raised = b && b.created ? new Date(istDay(b.created)) : i.sheetRaised;   // Basecamp first, sheet as fallback
      i.due = b && b.due ? pdate(b.due) : i.sheetDue;
      i.reused = !!(b && b.created && i.sheetRaised && (+i.sheetRaised - istDay(b.created)) > 30*864e5);
      i.status = (b && b.closed) ? "Done" : i.sheetStatus;
      i.bcBatch = false;
    }));
    /* Batch clean-ups: 5+ to-dos ticked off within 30 minutes, where most of them (60%+) were already a week or
       more past due, are bookkeeping, not deliveries — turnaround skips them. A burst of on-time deliveries is kept. */
    if(BC){
      const closed=Object.values(BC).filter(v=>v.closed).map(v=>({t:new Date(v.closed).getTime(), late: v.due ? (istDay(v.closed)-Date.parse(v.due+"T00:00:00Z"))/864e5 >= 7 : false})).sort((a,b)=>a.t-b.t);
      const batch=new Set(); const W=30*60000;
      for(let a=0,b=0;b<closed.length;b++){
        while(closed[b].t-closed[a].t>W) a++;
        const grp=closed.slice(a,b+1);
        if(grp.length>=5 && grp.filter(x=>x.late).length/grp.length>=0.6) grp.forEach(x=>batch.add(x.t));
      }
      tabs.forEach(t=>t.items.forEach(i=>{ if(i.bcClosed && batch.has(new Date(i.bcClosed).getTime())) i.bcBatch=true; }));
    }
  }
  const fmt=d=>d? d.getUTCDate()+" "+cap(MS[d.getUTCMonth()]) : "—";
  const pct=(a,b)=>b?Math.round(a*100/b):0;
  const tip=$("tip");
  function showTip(e,t){tip.textContent=t;tip.style.opacity=1;const x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px";}
  function hideTip(){tip.style.opacity=0;}

  const fa=new Date(D.fetchedAt);
  $("stamp").textContent="Updated "+fa.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"Asia/Kolkata"});

  /* ---------- state ---------- */
  let cur = tabs.length-1;   // -1 = all months
  let brand = "All";
  const byBrand = items => brand==="All" ? items : items.filter(i=>i.brand===brand);
  const periodItems = () => cur<0 ? ALL : tabs[cur].items;

  /* ---------- month nav (sidebar) ---------- */
  const nav=$("months");
  function drawNav(){
    nav.replaceChildren();
    const a=el("button","mbtn all"+(cur<0?" on":"")); a.type="button";
    a.append(el("span",null,"All months"), el("span","c",String(byBrand(ALL).length)));
    a.onclick=()=>{cur=-1;render();}; nav.append(a);
    tabs.forEach((t,i)=>{
      const b=el("button","mbtn"+(i===cur?" on":"")); b.type="button";
      b.append(el("span",null,cap(t.name)), el("span","c",String(byBrand(t.items).length)));
      b.setAttribute("aria-current",i===cur?"true":"false");
      b.onclick=()=>{cur=i;render();}; nav.append(b);
    });

  }
  /* ---------- brand pills ---------- */
  function drawBrandPills(){

    ["All",...BRANDS].forEach(b=>{const p=el("button","pill"+(b===brand?" on":""),b); p.type="button"; p.setAttribute("aria-pressed",b===brand); p.onclick=()=>{brand=b;render();}; f.append(p);});
  }

  function bars(host, groups){
    host.replaceChildren();

    const max=Math.max(...groups.map(g=>g.total));
    groups.forEach(g=>{
      const r=el("div","bar-row"), tr=el("div","track");
      const s1=el("div","seg"); s1.style.width=(g.done/max*100)+"%"; s1.style.background="var(--or)";
      const s2=el("div","seg"); s2.style.width=((g.total-g.done)/max*100)+"%"; s2.style.background="var(--grey)";
      tr.append(s1,s2);
      tr.onmousemove=e=>showTip(e,`${g.k}: ${g.done} of ${g.total} done${g.od?`, ${g.od} late`:""}`); tr.onmouseleave=hideTip;
      r.append(el("div","lbl",g.k), tr, el("div","num",g.done+"/"+g.total));
      host.append(r);
    });
  }
  function groupBy(items,keyFn){
    const m=new Map();
    items.forEach(i=>[].concat(keyFn(i)).forEach(k=>{
      if(!m.has(k)) m.set(k,{k,total:0,done:0,od:0});
      const g=m.get(k); g.total++; if(isDone(i)) g.done++; if(isOD(i)) g.od++;
    }));
    return [...m.values()].sort((a,b)=>(a.k==="Not assigned")-(b.k==="Not assigned")||b.total-a.total);
  }

  /* ---------- month-on-month strip ---------- */
  function strip(){
    const host=$("strip"); host.replaceChildren();
    const vals=tabs.map((t,i)=>{const it=byBrand(t.items); return {t,i,n:it.length,dn:it.filter(isDone).length};});
    const max=Math.max(1,...vals.map(v=>v.n)), avg=vals.reduce((a,v)=>a+v.n,0)/(vals.length||1), H=190;
    vals.forEach(({t,i,n,dn})=>{
      const prev=i>0?byBrand(tabs[i-1].items).length:null;
      const live = i===tabs.length-1 && ist.getUTCFullYear()===t.y && ist.getUTCMonth()===t.m;
      const diff = live ? "In progress" : prev===null ? "First month" : (n===prev ? "Same as " : `${Math.abs(n-prev)} ${n>prev?"more":"fewer"} than `) + (prev===null?"":cap(MS[tabs[i-1].m]));
      const c=el("button","mc"+(i===cur?" on":"")); c.type="button";
      c.setAttribute("aria-label",`${cap(t.name)}: ${n} DRs, ${pct(dn,n)}% done. ${diff}`);
      const plot=el("div","plot"), capEl=el("div","cap");
      capEl.style.height=Math.max(n/max*(H-34),18)+"px";
      plot.append(capEl);
      const label=el("span","mv",String(n));
      // value sits above the capsule
      const wrap=el("div"); wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:"+H+"px;width:100%";
      wrap.append(label, capEl); 
      const mf=el("span","mf"); if(live){mf.append(el("b",null,"In progress"));} else mf.textContent=pct(dn,n)+"% done";
      c.append(wrap, el("span","mn",cap(t.name)), mf);
      c.onmousemove=e=>showTip(e,`${cap(t.name)}: ${n} DRs · ${pct(dn,n)}% done · ${diff}`); c.onmouseleave=hideTip;
      c.onclick=()=>{cur=i;render();};
      host.append(c);
    });
    // dashed average line (measured against the capsule area: label row ~ 23px above)
    if(vals.length>1){
      const line=el("div","avg"); const capH=avg/max*(H-34);
      line.style.top=(6+H-capH)+"px"; line.append(el("b",null,"Avg "+Math.round(avg))); host.append(line);
    }
    $("strip-n").textContent = (brand==="All"?"":brand+" · ")+"Click a month to see details";
  }

  /* ---------- brand cards ---------- */
  function brandCards(){
    const host=$("brands"); host.replaceChildren();
    const items=periodItems(); const tot=items.length||1;
    const g=groupBy(items,i=>i.brand).sort((a,b)=>(a.k==="No brand")-(b.k==="No brand"));
    g.forEach(x=>{
      const c=el("button","bc"+(x.k===brand?" on":"")); c.type="button";
      const sh=el("div","share"), s=el("i"); s.style.width=pct(x.total,tot)+"%"; sh.append(s);
      c.append(el("span","bn",x.k), el("span","bv",String(x.total)), sh, el("span","bs",`${pct(x.total,tot)}% of DRs · ${pct(x.done,x.total)}% done`));
      c.onclick=()=>{brand = brand===x.k ? "All" : x.k; render();};
      host.append(c);
    });
    $("brand-n").textContent = "Click a brand to filter";
  }

  /* ---------- donut ---------- */
  function donut(items){
    const host=$("donut"); host.replaceChildren();
    const order=[["Done","#FF6B1A"],["In review","#FF9A5C"],["In progress","#F7B98F"],["Waiting","#B89A8C"],["Not started","#7A5A4C"],["Dropped","#3A2218"]];
    const counts=order.map(([k,c])=>({k,c,n:items.filter(i=>i.status===k).length})).filter(x=>x.n);
    const other=items.filter(i=>!order.some(o=>o[0]===i.status)).length; if(other) counts.push({k:"Other",c:"#555",n:other});
    const done=items.filter(isDone).length, p=pct(done,items.length), ns="http://www.w3.org/2000/svg";
    const set=(e,a)=>{for(const k in a)e.setAttribute(k,a[k]);return e;};
    const svg=set(document.createElementNS(ns,"svg"),{viewBox:"0 0 260 150",width:"100%"}); svg.style.maxWidth="300px"; svg.style.display="block";
    const defs=document.createElementNS(ns,"defs"), g=set(document.createElementNS(ns,"linearGradient"),{id:"gg",x1:"0",y1:"1",x2:"1",y2:"0"});
    [["0%","#E8480C"],["60%","#FF6B1A"],["100%","#FFB27F"]].forEach(([o,c])=>g.append(set(document.createElementNS(ns,"stop"),{offset:o,"stop-color":c})));
    defs.append(g); svg.append(defs);
    const N=30, cx=130, cy=136, r1=86, r2=120, on=Math.round(N*p/100);
    for(let k=0;k<N;k++){
      const a=Math.PI - k*Math.PI/(N-1);
      const l=set(document.createElementNS(ns,"line"),{x1:cx+r1*Math.cos(a),y1:cy-r1*Math.sin(a),x2:cx+r2*Math.cos(a),y2:cy-r2*Math.sin(a),
        stroke:k<on?"url(#gg)":"rgba(80,35,15,.13)","stroke-width":6,"stroke-linecap":"round"});
      svg.append(l);
    }
    const t1=set(document.createElementNS(ns,"text"),{x:cx,y:cy-12,"text-anchor":"middle","font-size":40,"font-weight":500,"letter-spacing":"-1.5",fill:"#2A1208"}); t1.textContent=p+"%";
    const t2=set(document.createElementNS(ns,"text"),{x:cx,y:cy+8,"text-anchor":"middle","font-size":12,fill:"#9C7564"}); t2.textContent=`done · ${done} of ${items.length}`;
    svg.append(t1,t2);
    svg.addEventListener("mousemove",e=>showTip(e,counts.map(s=>`${s.k} ${s.n}`).join(" · "))); svg.addEventListener("mouseleave",hideTip);
    host.append(svg);
    const lg=el("div","legend");
    counts.forEach(s=>{const sp=el("span",null,`${s.k} ${s.n}`); sp.style.setProperty("--c",s.c); lg.append(sp);});
    host.append(lg);
  }

  /* ---------- turnaround ---------- */
  function turnaround(items){
    const host=$("ta"); host.replaceChildren();
    if(!BC){ host.append(el("div","empty", BC===false ? (window.__localPreview ? "Turnaround comes from Basecamp and shows on the live site only." : "Turnaround isn't available right now. It will be back after the next update.") : "Loading turnaround from Basecamp…")); return; }
    const closed=items.filter(i=>i.bcClosed && !i.bcBatch && !i.reused && openedOn(i)!=null && istDay(i.bcClosed)>=openedOn(i));
    const skipped=items.filter(i=>i.bcClosed && i.bcBatch).length, reusedN=items.filter(i=>i.bcClosed && i.reused && !i.bcBatch).length;
    if(!closed.length){ host.append(el("div","empty","No DRs closed in Basecamp for this view yet.")); return; }
    const days=closed.map(daysOpen).sort((a,b)=>a-b);
    const avg=Math.round(days.reduce((a,b)=>a+b,0)/days.length*10)/10;
    const med=days[Math.floor(days.length/2)];
    const slow=closed.slice().sort((a,b)=>daysOpen(b)-daysOpen(a))[0];
    const w=el("div","ta");
    const tile=(v,l,sub)=>{const t=el("div","t"); t.append(el("b",null,v), el("span",null,l)); if(sub) t.append(el("small",null,sub)); return t;};
    w.append(tile(plural(med,"day"),"Typical time to close",`Average: ${plural(avg,"day")}`));
    w.append(tile(plural(daysOpen(slow),"day"),"Slowest to close",slow.name));
    const pend=items.filter(isOpen).filter(i=>daysOpen(i)!=null).sort((a,b)=>daysOpen(b)-daysOpen(a))[0];
    w.append(pend ? tile(plural(daysOpen(pend),"day"),"Longest still pending",pend.name) : tile("—","Longest still pending","Nothing pending"));
    const per=new Map(); closed.forEach(i=>i.owners.forEach(o=>{ if(o==="Not assigned") return; const a=per.get(o)||[]; a.push(daysOpen(i)); per.set(o,a); }));
    const pp=el("div","t wide"), list=el("div","ppl");
    [...per.entries()].map(([k,a])=>{const s=a.slice().sort((x,y)=>x-y);return [k,s[Math.floor(s.length/2)],a.length];}).sort((a,b)=>a[1]-b[1]).forEach(([k,v,n])=>{const r=el("div"); r.append(el("span",null,k), el("em",null,`${plural(v,"day")} typical · ${n} closed`)); list.append(r);});
    pp.append(el("span",null,"Typical time to close, by person")); pp.firstChild.style.marginTop="0"; pp.firstChild.style.marginBottom="10px"; pp.append(list);
    w.append(pp); host.append(w);
    const nc=[]; if(skipped) nc.push(`${plural(skipped,"DR")} ticked off in a batch clean-up (5+ within 30 minutes, mostly long overdue)`); if(reusedN) nc.push(`${plural(reusedN,"DR")} on an old, reused Basecamp to-do (created 30+ days before the DR was raised)`);
    if(nc.length) host.append(el("p","health","Not counted: "+nc.join(" · ")+". Their dates are still shown under Closed DRs."));

  }

  function drCell(i){
    const nc=el("td","dr");
    if(i.link){const a=el("a","drl",i.name); a.href=i.link; a.target="_blank"; a.rel="noopener"; a.title="Open in Basecamp"; a.append(el("span","ext","↗")); nc.append(a);} else nc.textContent=i.name;
    return nc;
  }
  const fmtDT=iso=>{const d=new Date(iso); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"Asia/Kolkata"});};

  /* ---------- closed DRs ---------- */
  function closedTable(items){
    const host=$("cl"); host.replaceChildren();
    if(!BC){ host.append(el("div","empty", BC===false ? (window.__localPreview ? "Closed dates come from Basecamp and show on the live site only." : "Closed dates aren't available right now.") : "Loading from Basecamp…")); $("cl-n").textContent=""; return; }
    const list=items.filter(i=>i.bcClosed).sort((a,b)=>new Date(b.bcClosed)-new Date(a.bcClosed));
    $("cl-n").textContent= list.length ? "Most recently closed first" : "";
    if(!list.length){ host.append(el("div","empty","No DRs ticked off in Basecamp for this view yet.")); return; }
    const tb=el("table"), hd=el("tr");
    [["DR",""],["Brand","hide-m"],["Created","hide-m"],["Due","hide-m"],["Closed",""],["Closed by","hide-m"],["Took","hide-m"],["","r"]].forEach(([h,c])=>hd.append(el("th",c,h)));

  }

  /* ---------- render ---------- */
  function render(){
    drawNav(); drawBrandPills();
    const all = cur<0, t = all?null:tabs[cur];
    const items = byBrand(periodItems());
    const label = all ? "All months" : cap(t.name)+" "+t.y;
    const h1=$("mname"); h1.replaceChildren(document.createTextNode(label)); if(brand!=="All") h1.append(el("span","b"," · "+brand));

    const tot=items.length, dn=items.filter(isDone).length, op=items.filter(isOpen), od=items.filter(isOD), scr=items.filter(isScr).length;
    $("k-total-h").textContent = "Total DRs";
    $("k-total").textContent=tot;
    if(all){ $("k-total-n").textContent="Each DR counted once"; }
    else{
      const carried=items.filter(i=>i.raised && (i.raised.getUTCFullYear()*12+i.raised.getUTCMonth()) < (t.y*12+t.m)).length;
      $("k-total-n").textContent = carried ? `${carried} came from earlier months` : "All new this month";
    }
    $("k-done").textContent=dn;
    $("k-done-n").textContent=`${pct(dn,tot)}% of total`+(scr?` · ${scr} dropped`:"");
    $("k-open").textContent=op.length;
    const pr=op.filter(i=>i.status==="In review").length, ip=op.filter(i=>i.status==="In progress").length, ns=op.length-pr-ip;
    $("k-open-n").textContent= op.length ? `${ip} in progress · ${pr} in review · ${ns} not started` : "Nothing pending";
    $("k-od").textContent=od.length;

      `${dn} of ${tot} DRs done (${pct(dn,tot)}%). ` + (od.length ? `${od.length} ${od.length>1?"are":"is"} late.` : op.length ? `${op.length} pending, none late.` : "Nothing pending.");

    else{

    const ah=$("att"); ah.replaceChildren();
    const list=op.slice().sort((a,b)=>odDays(b)-odDays(a)||((a.due||0)-(b.due||0)));
    $("att-n").textContent= list.length ? "Most late first" : "";
    if(!list.length){ ah.append(el("div","empty","Nothing pending. All DRs here are done.")); }
    else{
      const tb=el("table"), hd=el("tr");
      [["DR",""],["Brand","hide-m"],["Assigned",""],["Created","hide-m"],["Due","hide-m"],["Open for","hide-m"],["Status","hide-m"],["","r"]].forEach(([h,c])=>hd.append(el("th",c,h)));
      tb.append(el("thead")); tb.tHead.append(hd); const body=el("tbody"); tb.append(body);
      let showAll=false;
      const draw=()=>{
        body.replaceChildren();
        (showAll?list:list.slice(0,8)).forEach(i=>{
          const tr=el("tr"), d=odDays(i);
          tr.append(drCell(i), el("td","hide-m",i.brand), el("td",null,i.owners.join(", ")), el("td","hide-m",fmt(i.raised)), el("td","hide-m",fmt(i.due)), el("td","hide-m",daysOpen(i)==null?"—":plural(daysOpen(i),"day")), el("td","hide-m",i.status));
          const tc=el("td","r"); tc.append(el("span","tag"+(d>0?" od":""), d>0?`${d} day${d>1?"s":""} late`: d===0&&i.due?"Due today":i.due?`Due in ${-d} day${-d>1?"s":""}`:"No due date"));
          tr.append(tc); body.append(tr);
        });
      };
      draw(); ah.append(tb);
      if(list.length>8){const m=el("button","more",`Show all ${list.length}`); m.type="button"; m.onclick=()=>{showAll=!showAll; m.textContent=showAll?"Show less":`Show all ${list.length}`; draw();}; ah.append(m);}
    }

    closedTable(items);
    const orph=items.filter(i=>i.orphaned&&isOpen(i)).length;
    const unowned=items.filter(i=>i.owners[0]==="Not assigned").length-items.filter(i=>i.orphaned).length;
    const nodue=items.filter(i=>!i.due).length;
    const notes=[]; if(orph) notes.push(`${orph} pending DR${orph>1?"s":""} need${orph>1?"":"s"} a new owner (person has left)`);
    if(unowned>0) notes.push(`${unowned} not assigned`);
    if(BC){ const a=items.filter(i=>i.bcKnown&&i.bcClosed&&i.sheetStatus!=="Done").length, b=items.filter(i=>i.bcKnown&&!i.bcClosed&&i.sheetStatus==="Done").length;
      if(a) notes.push(`${a} ticked off in Basecamp but not marked Done in the sheet`); if(b) notes.push(`${b} marked Done in the sheet but still open in Basecamp`); } if(nodue) notes.push(`${nodue} ${nodue>1?"have":"has"} no due date`);
    const hEl=$("health"); hEl.replaceChildren();
    if(notes.length){ hEl.append(el("b",null,"To fix in the sheet: "), document.createTextNode(notes.join(" · ")+". Fixes show here the next morning.")); }
  }
  applyBC(); render();
  const useBC = j => { BC = j && j.ok ? j.todos : false; applyBC(); render(); };
  if (window.BC_DATA) useBC(window.BC_DATA);
  else if (location.protocol.startsWith("http")) fetch(BC_URL).then(r=>r.ok?r.json():null).then(useBC).catch(()=>useBC(null));
  else { BC=false; window.__localPreview=true; applyBC(); render(); }
})();
</script>
</body>
</html>
